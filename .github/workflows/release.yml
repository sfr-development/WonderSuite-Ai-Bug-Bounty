name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        default: '0.1.0'
  push:
    tags:
      - 'v*'

# v0.3.24: Three-stage pipeline to fix the race that hit v0.3.23 (Windows
# + macOS-aarch64 failed with "Sorry. Your account was suspended" because
# four matrix jobs were calling `gh release create` in parallel and 1–2
# lost the API arbitration).
#
#   create-release  →  build (matrix, parallel)  →  publish-release
#       │                    │                              │
#       │ creates DRAFT       │ uploads assets to            │ flips draft → public
#       │ once, returns       │ existing draft (no concurrent│ once every platform
#       │ release_id          │ release-create races)        │ build succeeded
#
# Net effect: matrix-jobs still run in parallel (fast), but they no longer
# try to *create* the release — they only *upload assets* into a release
# that already exists. The atomic publish at the end means a half-built
# release is never visible to users.
jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${{ github.ref_name }}"
          fi
          # Strip an arbitrary number of leading 'v' (defends against both 'v0.1.1' and accidental 'vv0.1.1')
          VERSION="$RAW"
          while [[ "$VERSION" == v* ]]; do VERSION="${VERSION#v}"; done
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-].+)?$ ]]; then
            echo "::error::Resolved version '$VERSION' (from '$RAW') is not valid semver"
            exit 1
          fi
          echo "Using version: $VERSION (tag will be v$VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Extract the body of the current release from CHANGELOG.md so the
      # GitHub release page + the in-app Changelog tab show real content
      # instead of the workflow's boilerplate.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          BODY="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { capture = 0 }
            capture { print }
          ' CHANGELOG.md | sed -e '/^$/N;/^\n$/D')"
          if [ -z "$BODY" ]; then
            echo "::warning::No CHANGELOG section found for v$VERSION — using fallback body"
            BODY="Automated release for WonderSuite v$VERSION. See CHANGELOG.md for details."
          fi
          {
            echo "body<<__END_OF_NOTES__"
            echo "$BODY"
            echo "__END_OF_NOTES__"
          } >> "$GITHUB_OUTPUT"

      # Idempotent: if a release for this tag already exists (manual prep,
      # a re-run, or a tag pushed without a matching workflow run), reuse
      # its id instead of failing. Otherwise create a fresh DRAFT.
      #
      # NOTE: `gh release create --draft` creates a release that has NO tag
      # association until it is published, so an immediate lookup via
      # `gh api releases/tags/TAG` returns 404. The fix is to capture the
      # release id from the POST response atomically via `gh api --jq .id`.
      - name: Create or reuse draft release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.body }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -e
          if ID=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq .id 2>/dev/null) && [ -n "$ID" ]; then
            echo "Found existing release for ${TAG} with id=${ID}"
          else
            echo "Creating draft release ${TAG}"
            # Use the REST API directly so we get the id atomically from the
            # POST response — gh release create does not return JSON and the
            # subsequent tag-based lookup fails while the release is still a draft.
            ID=$(gh api "repos/${REPO}/releases" \
              --method POST \
              -f "tag_name=${TAG}" \
              -f "name=WonderSuite ${TAG}" \
              -f "body=${NOTES}" \
              -F "draft=true" \
              --jq '.id')
            echo "Created draft release ${TAG} with id=${ID}"
          fi
          echo "release_id=${ID}" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Sync version into manifests
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf-8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const cargoPath = "src-tauri/Cargo.toml";
            let cargo = fs.readFileSync(cargoPath, "utf-8");
            cargo = cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`);
            fs.writeFileSync(cargoPath, cargo);
            console.log("Bumped to", v);
          '

      - name: Install dependencies (ubuntu)
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            nasm cmake clang libclang-dev \
            libpcap-dev

      - name: Install build dependencies (macOS)
        if: matrix.settings.platform == 'macos-latest'
        run: |
          brew install nasm cmake
          # libpcap is preinstalled on macOS runners; nothing more needed for pnet.

      - name: Install build dependencies (Windows)
        if: matrix.settings.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          choco install llvm --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # No Npcap SDK install needed anymore — WinDivert is bundled in
          # resources/drivers/windivert/ and dlopened at runtime via libloading.

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Cargo.lock matches
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --quiet || (echo "Lockfile drift — run 'cargo update' locally and commit Cargo.lock"; exit 1)

      # Upload-only: releaseId tells tauri-action the release already
      # exists (from the create-release job) — it skips create/edit and
      # only attaches platform-specific bundles. No more concurrent
      # create-release calls across the matrix.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.settings.args }}
          includeUpdaterJson: true

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # tauri-action generates latest.json with an empty "notes" field when
      # called via releaseId (it doesn't read the release body). Re-upload the
      # latest.json with the real CHANGELOG notes so the in-app update modal
      # shows "what's new".
      - name: Patch latest.json with release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -e
          # Extract notes from CHANGELOG.md
          NOTES="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { capture = 0 }
            capture { print }
          ' CHANGELOG.md | sed -e '/^$/N;/^\n$/D')"

          # Download the latest.json that tauri-action uploaded
          gh release download "${TAG}" --repo "${REPO}" --pattern "latest.json" --dir /tmp --clobber

          # Inject notes into the JSON
          PATCHED=$(jq --arg n "$NOTES" '.notes = $n' /tmp/latest.json)
          echo "$PATCHED" > /tmp/latest.json

          # Re-upload (overwrite) the asset
          gh release upload "${TAG}" /tmp/latest.json \
            --repo "${REPO}" \
            --clobber

      - name: Publish release (flip draft → public)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release edit "${TAG}" --repo "${REPO}" --draft=false
          echo "Released ${TAG} (now visible at https://github.com/${REPO}/releases/tag/${TAG})"
